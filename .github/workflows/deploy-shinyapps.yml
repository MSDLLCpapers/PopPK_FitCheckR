name: Deploy to shinyapps.io

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: shinyapps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rsconnect
            any::remotes

      # Pinning to github.sha makes rsconnect record this exact commit as the
      # RemoteSha, so shinyapps.io rebuilds the version that triggered the run.
      - name: Install PopPKFitCheckR from this commit
        shell: Rscript {0}
        run: |
          remotes::install_github(
            paste0("${{ github.repository }}@", "${{ github.sha }}"),
            upgrade = "never"
          )

      - name: Deploy
        shell: Rscript {0}
        env:
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          rsconnect::setAccountInfo(
            name   = "ruilian-zhang",
            token  = Sys.getenv("SHINYAPPS_TOKEN"),
            secret = Sys.getenv("SHINYAPPS_SECRET")
          )
          rsconnect::deployApp(
            appDir      = "inst/shiny",
            appName     = "PopPK-FitCheckR",
            appTitle    = "PopPK FitCheckR",
            appFiles    = "app.R",
            account     = "ruilian-zhang",
            server      = "shinyapps.io",
            forceUpdate = TRUE
          )
